[package]
name = "ok-script-gpui"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native GPUI desktop shell for ok-script"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", branch = "main", package = "gpui", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", branch = "main", package = "gpui_platform" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.26"
